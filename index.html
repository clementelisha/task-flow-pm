<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;background:#0a0a0a;color:#fff;max-width:430px;margin:0 auto;height:100vh;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh;background:#0a0a0a}
.header{background:linear-gradient(135deg,#ff006e 0%,#8338ec 50%,#3a86ff 100%);padding:48px 24px 32px;position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,255,255,.1) 0%,transparent 70%);animation:pulse 8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(10px,10px) scale(1.1)}}
.header h1{font-size:36px;font-weight:800;letter-spacing:-1px;margin-bottom:8px;position:relative}
.header p{font-size:15px;opacity:.85;position:relative;font-weight:500}
.tabs{display:flex;padding:8px 24px;background:#0a0a0a;gap:8px;border-bottom:1px solid rgba(255,255,255,.05)}
.tab{flex:1;padding:12px 16px;text-align:center;cursor:pointer;border-radius:12px;transition:all .3s cubic-bezier(.4,0,.2,1);font-size:14px;font-weight:600;color:rgba(255,255,255,.5);background:transparent}
.tab.active{color:#fff;background:rgba(255,255,255,.08);box-shadow:0 4px 16px rgba(131,56,236,.2)}
.content{flex:1;overflow-y:auto;padding:24px;padding-bottom:100px}
.fab{position:fixed;bottom:90px;right:24px;width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#ff006e 0%,#8338ec 100%);color:#fff;border:none;font-size:28px;cursor:pointer;box-shadow:0 8px 32px rgba(131,56,236,.4);transition:all .3s cubic-bezier(.4,0,.2,1);display:flex;align-items:center;justify-content:center}
.fab:hover{transform:scale(1.1);box-shadow:0 12px 40px rgba(131,56,236,.6)}
.fab:active{transform:scale(.95)}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);z-index:100;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.modal-content{background:#1a1a1a;border-radius:24px 24px 0 0;width:100%;max-width:430px;padding:32px 24px;max-height:85vh;overflow-y:auto;animation:slideUp .3s cubic-bezier(.4,0,.2,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-content h2{margin-bottom:24px;font-size:28px;font-weight:700;letter-spacing:-.5px}
.form-group{margin-bottom:20px}
.form-group label{display:block;margin-bottom:8px;font-size:14px;color:rgba(255,255,255,.7);font-weight:600}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:14px 16px;border:2px solid rgba(255,255,255,.1);border-radius:12px;font-size:15px;background:#0a0a0a;color:#fff;transition:all .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#8338ec;background:#1a1a1a}
.form-group textarea{resize:vertical;min-height:80px;font-family:inherit}
.btn-group{display:flex;gap:12px;margin-top:28px}
.btn{flex:1;padding:16px;border:none;border-radius:14px;cursor:pointer;font-size:16px;font-weight:700;transition:all .2s;letter-spacing:-.3px}
.btn-primary{background:linear-gradient(135deg,#ff006e 0%,#8338ec 100%);color:#fff;box-shadow:0 4px 16px rgba(131,56,236,.3)}
.btn-primary:active{transform:scale(.98)}
.btn-secondary{background:rgba(255,255,255,.08);color:#fff}
.btn-secondary:active{background:rgba(255,255,255,.12)}
.project-card{background:linear-gradient(135deg,#1a1a1a 0%,#2a2a2a 100%);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:24px;margin-bottom:16px;cursor:pointer;transition:all .3s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden}
.project-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#ff006e 0%,#8338ec 50%,#3a86ff 100%);opacity:0;transition:opacity .3s}
.project-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,.4);border-color:rgba(255,255,255,.15)}
.project-card:hover::before{opacity:1}
.project-card:active{transform:translateY(-2px)}
.project-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:12px}
.project-title{font-weight:700;font-size:20px;color:#fff;letter-spacing:-.3px}
.project-status{font-size:11px;padding:6px 12px;border-radius:20px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.status-active{background:rgba(58,134,255,.2);color:#3a86ff}
.status-completed{background:rgba(6,214,160,.2);color:#06d6a0}
.status-planning{background:rgba(255,159,28,.2);color:#ff9f1c}
.project-desc{font-size:15px;color:rgba(255,255,255,.6);margin-bottom:16px;line-height:1.5}
.project-meta{display:flex;gap:16px;font-size:13px;color:rgba(255,255,255,.5);font-weight:600}
.task-item{background:rgba(255,255,255,.03);border-left:4px solid #8338ec;padding:16px;margin-bottom:12px;border-radius:12px;transition:all .2s}
.task-item.done{opacity:.5;border-left-color:#06d6a0}
.task-item.done .task-title{text-decoration:line-through}
.task-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.task-title{font-weight:700;font-size:16px}
.task-priority{font-size:10px;padding:4px 10px;border-radius:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.priority-high{background:rgba(239,35,60,.2);color:#ef233c}
.priority-medium{background:rgba(255,159,28,.2);color:#ff9f1c}
.priority-low{background:rgba(6,214,160,.2);color:#06d6a0}
.task-desc{font-size:14px;color:rgba(255,255,255,.6);margin-bottom:12px}
.task-actions{display:flex;gap:8px}
.task-btn{padding:8px 16px;border:none;border-radius:10px;font-size:12px;cursor:pointer;font-weight:700;transition:all .2s}
.btn-complete{background:rgba(6,214,160,.15);color:#06d6a0}
.btn-complete:active{background:rgba(6,214,160,.25)}
.btn-delete{background:rgba(239,35,60,.15);color:#ef233c}
.btn-delete:active{background:rgba(239,35,60,.25)}
.empty{text-align:center;padding:60px 20px;color:rgba(255,255,255,.3);font-size:16px;line-height:1.6}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.stat-card{background:linear-gradient(135deg,rgba(255,0,110,.1) 0%,rgba(131,56,236,.1) 100%);border:1px solid rgba(255,255,255,.08);padding:24px;border-radius:20px;text-align:center}
.stat-value{font-size:42px;font-weight:800;margin-bottom:6px;background:linear-gradient(135deg,#ff006e 0%,#8338ec 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-label{font-size:13px;color:rgba(255,255,255,.6);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2)}
</style>
</head>
<body>
<div class="app">
<div class="header">
<h1>Pulse</h1>
<p>Project Management</p>
</div>
<div class="tabs" id="tabs">
<div class="tab active" data-tab="projects">Projects</div>
<div class="tab" data-tab="tasks">Tasks</div>
<div class="tab" data-tab="stats">Stats</div>
</div>
<div class="content" id="content"></div>
<button class="fab" id="fab">+</button>
</div>

<div class="modal" id="modal">
<div class="modal-content" id="modalContent">
<h2 id="modalTitle">New Project</h2>
<div id="modalForm"></div>
</div>
</div>

<script>
let S={projects:[],currentTab:'projects'};

const load=()=>{const d=localStorage.getItem('pulse');if(d)S={...S,...JSON.parse(d)}};
const save=()=>localStorage.setItem('pulse',JSON.stringify({projects:S.projects}));

const render=()=>{
const c=document.getElementById('content');
if(S.currentTab==='projects'){
c.innerHTML=S.projects.length?S.projects.map((p,i)=>`
<div class="project-card" data-index="${i}">
<div class="project-header">
<div class="project-title">${p.name}</div>
<div class="project-status status-${p.status}">${p.status}</div>
</div>
<div class="project-desc">${p.desc}</div>
<div class="project-meta">
<span>📅 ${p.date}</span>
<span>✓ ${p.tasks.filter(t=>t.done).length}/${p.tasks.length}</span>
</div>
</div>
`).join(''):'<div class="empty">No projects yet<br><br>Tap + to create your first project</div>';
document.querySelectorAll('.project-card').forEach(el=>el.onclick=()=>viewProject(parseInt(el.dataset.index)));
}else if(S.currentTab==='tasks'){
const tasks=S.projects.flatMap(p=>p.tasks.map(t=>({...t,project:p.name})));
c.innerHTML=tasks.length?tasks.map(t=>`
<div class="task-item ${t.done?'done':''}">
<div class="task-header">
<div class="task-title">${t.title}</div>
<div class="task-priority priority-${t.priority}">${t.priority}</div>
</div>
<div class="task-desc">${t.project}</div>
</div>
`).join(''):'<div class="empty">No tasks yet</div>';
}else{
const total=S.projects.length;
const completed=S.projects.filter(p=>p.status==='completed').length;
const tasks=S.projects.flatMap(p=>p.tasks);
const doneTasks=tasks.filter(t=>t.done).length;
c.innerHTML=`
<div class="stats">
<div class="stat-card"><div class="stat-value">${total}</div><div class="stat-label">Projects</div></div>
<div class="stat-card"><div class="stat-value">${completed}</div><div class="stat-label">Completed</div></div>
<div class="stat-card"><div class="stat-value">${tasks.length}</div><div class="stat-label">Total Tasks</div></div>
<div class="stat-card"><div class="stat-value">${doneTasks}</div><div class="stat-label">Completed</div></div>
</div>
${S.projects.map((p,i)=>`
<div class="project-card" data-index="${i}">
<div class="project-header">
<div class="project-title">${p.name}</div>
<div class="project-status status-${p.status}">${p.status}</div>
</div>
<div class="project-meta">
<span>Tasks: ${p.tasks.filter(t=>t.done).length}/${p.tasks.length}</span>
</div>
</div>
`).join('')}
`;
document.querySelectorAll('.project-card').forEach(el=>el.onclick=()=>viewProject(parseInt(el.dataset.index)));
}
};

const showModal=(title,form)=>{
document.getElementById('modalTitle').textContent=title;
document.getElementById('modalForm').innerHTML=form;
document.getElementById('modal').classList.add('show');
};

const hideModal=()=>document.getElementById('modal').classList.remove('show');

window.addProject=()=>{
showModal('New Project',`
<div class="form-group"><label>Project Name</label><input id="pName" placeholder="Enter project name"></div>
<div class="form-group"><label>Description</label><textarea id="pDesc" placeholder="What's this project about?"></textarea></div>

<div class="form-group"><label>Status</label><select id="pStatus">
<option value="planning">Planning</option>
<option value="active">Active</option>
<option value="completed">Completed</option>
</select></div>
<div class="btn-group">
<button class="btn btn-secondary" onclick="hideModal()">Cancel</button>
<button class="btn btn-primary" onclick="saveProject()">Create</button>
</div>
`);
};

window.saveProject=()=>{
const name=document.getElementById(‘pName’).value;
const desc=document.getElementById(‘pDesc’).value;
const status=document.getElementById(‘pStatus’).value;
if(!name)return alert(‘Name required’);
S.projects.push({id:Date.now().toString(),name,desc,status,date:new Date().toLocaleDateString(),tasks:[]});
save();render();hideModal();
};

window.viewProject=(idx)=>{
const p=S.projects[idx];
if(!p)return;
showModal(p.name,`

<div class="project-desc">${p.desc}</div>
<div class="project-meta" style="margin:12px 0"><span>Status: ${p.status}</span></div>
<h3 style="margin:24px 0 12px;font-size:18px;font-weight:700">Tasks (${p.tasks.length})</h3>
<div>${p.tasks.map((t,i)=>`
<div class="task-item ${t.done?'done':''}">
<div class="task-header">
<div class="task-title">${t.title}</div>
<div class="task-priority priority-${t.priority}">${t.priority}</div>
</div>
<div class="task-desc">${t.desc}</div>
<div class="task-actions">
<button class="task-btn btn-complete" onclick="toggleTask(${idx},${i})">${t.done?'Undo':'Complete'}</button>
<button class="task-btn btn-delete" onclick="deleteTask(${idx},${i})">Delete</button>
</div>
</div>
`).join('')||'<div class="empty">No tasks yet</div>'}</div>
<div class="btn-group" style="margin-top:24px">
<button class="btn btn-primary" onclick="addTask(${idx})">Add Task</button>
<button class="btn btn-secondary" onclick="hideModal()">Close</button>
</div>
`);
};

window.addTask=(idx)=>{
showModal(‘New Task’,`

<div class="form-group"><label>Task Title</label><input id="tTitle" placeholder="What needs to be done?"></div>
<div class="form-group"><label>Description</label><textarea id="tDesc" placeholder="Add details..."></textarea></div>
<div class="form-group"><label>Priority</label><select id="tPriority">
<option value="low">Low</option>
<option value="medium">Medium</option>
<option value="high">High</option>
</select></div>
<div class="btn-group">
<button class="btn btn-secondary" onclick="viewProject(${idx})">Cancel</button>
<button class="btn btn-primary" onclick="saveTask(${idx})">Add Task</button>
</div>
`);
};

window.saveTask=(idx)=>{
const title=document.getElementById(‘tTitle’).value;
const desc=document.getElementById(‘tDesc’).value;
const priority=document.getElementById(‘tPriority’).value;
if(!title)return alert(‘Title required’);
S.projects[idx].tasks.push({id:Date.now().toString(),title,desc,priority,done:false});
save();viewProject(idx);
};

window.toggleTask=(pidx,tidx)=>{
S.projects[pidx].tasks[tidx].done=!S.projects[pidx].tasks[tidx].done;
save();viewProject(pidx);
};

window.deleteTask=(pidx,tidx)=>{
if(!confirm(‘Delete this task?’))return;
S.projects[pidx].tasks.splice(tidx,1);
save();viewProject(pidx);
};

document.getElementById(‘tabs’).onclick=(e)=>{
if(e.target.classList.contains(‘tab’)){
document.querySelectorAll(’.tab’).forEach(t=>t.classList.remove(‘active’));
e.target.classList.add(‘active’);
S.currentTab=e.target.dataset.tab;
render();
}
};

document.getElementById(‘fab’).onclick=()=>{
if(S.currentTab===‘projects’)addProject();
};

document.getElementById(‘modal’).onclick=(e)=>{
if(e.target.id===‘modal’)hideModal();
};

load();render();
</script>

</body>
</html>
